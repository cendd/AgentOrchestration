version: '3.8'

services:
  scheduler:
    build:
      context: ..
      dockerfile: infra/Dockerfile.scheduler
    ports:
      - "8000:8000"
    environment:
      - TZ=${TZ:-UTC}
      - REDIS_HOST=redis
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/agent_orchestrator
    volumes:
      - ../src:/app/src
    healthcheck:
      test: ["CMD", "python", "-c", "import time; print(time.tzname)"]
      interval: 30s
      timeout: 5s
      retries: 3

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: agent_orchestrator
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
